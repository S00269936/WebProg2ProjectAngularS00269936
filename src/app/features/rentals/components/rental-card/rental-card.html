<div class="card">
    <h3>{{ rental().bikeName }}</h3>
    <p>Customer: {{ rental().customerName }}</p>
    <p>Start Date: {{ rental().startDate | date:'dd/MM/yyyy' }}</p>
    <p>End Date: {{ rental().endDate | date:'dd/MM/yyyy' }}</p>
    <p>Total Price: €{{ rental().totalPrice }}</p>
    <p>Status: {{ rental().status ? 'Rented' : 'Not Rented' }}</p>
    <a matbutton matButton="filled" [routerLink]="['/rentals', rental()._id]">View Rental</a>
</div>
