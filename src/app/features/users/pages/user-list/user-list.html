<h2>User List</h2>
<div class="buttons">
  <a matbutton matButton="filled" routerLink="/users/new">Add New User</a>
  <a matbutton matButton="filled" routerLink="/">Go Home</a>
</div>
@let s = state();
@if (s.status === 'loading') {
  <p>Loading users...</p>
} @else if (s.status === 'error') {
  <p>{{ s.message }}</p>
} @else if (s.data.length === 0) {
  <p>No users available at the moment</p>
} @else {
  <div class="grid">
    @for (user of s.data; track user._id) {
      <app-user-card [user]="user"></app-user-card>
    }
  </div>
}
